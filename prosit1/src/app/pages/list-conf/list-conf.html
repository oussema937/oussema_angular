
<div class="container mt-5 mb-5">

  <div class="text-center mb-5">
    <h2 class="fw-bold">Upcoming Conferences</h2>
    <p class="text-muted">
      Discover our latest conferences and reserve your place.
    </p>
  </div>

  <div class="row g-4">

    @for (conf of conferences; track conf.title) {

      <div class="col-md-6 col-lg-4">

        <div class="card h-100 shadow-sm border-0">

          <!-- Conference Picture -->
          <img
            [src]="conf.picture"
            class="card-img-top"
            alt="Conference image">

          <div class="card-body">

            <!-- Title -->
            <h5 class="card-title fw-bold">
              {{ conf.title }}
            </h5>

            <!-- Date -->
            <p class="text-muted mb-2">
              <i class="bi bi-calendar-event me-2"></i>
              {{ conf.date }}
            </p>

            <!-- Address -->
            <p class="text-muted mb-2">
              <i class="bi bi-geo-alt me-2"></i>
              {{ conf.address }}
            </p>

            <!-- Available Places -->
            <p class="mb-3">
              <span class="badge bg-success">
                {{ conf.availablePlaces }} places available
              </span>
            </p>

            <button class="btn btn-primary w-100">
              View Details
            </button>

          </div>
        </div>

      </div>

    }

  </div>
</div>
