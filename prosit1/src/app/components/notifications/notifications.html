<section id="notifications" class="panel panel-orange">
  <div class="icon">🔔</div>
  <div>
    <h2>Zone de notifications</h2>
    <p>Vous avez {{ notifications.length }} nouvelles notifications.</p>

    <button type="button" (click)="toggle()">
      {{ show ? 'Masquer les notifications' : 'Afficher les notifications' }}
    </button>

    @if (show) {
      <ul>
        @for (n of notifications; track n) {
          <li>{{ n }}</li>
        }
      </ul>
    }
  </div>
</section>
